<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laraport</title>
    <style>
        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            background-color: #f8fafc;
            color: #334155;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 800px;
            padding: 40px 20px;
        }
        h1 {
            font-size: 3.5em;
            font-weight: 700;
            margin-bottom: 20px;
            color: #1e293b;
        }
        p {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .features {
            display: flex;
            justify-content: space-around;
            margin-top: 40px;
            flex-wrap: wrap; /_ برای ریسپانسیو شدن در صفحه‌های کوچک‌تر _/
        }
        .feature-item {
            flex: 1;
            min-width: 200px; /_ حداقل عرض برای هر آیتم _/
            margin: 15px;
            padding: 20px;
            margin: 13px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .feature-item h3 {
            margin-top: 0;
            color: #0f172a;
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        .feature-item p {
            font-size: 1em;
            color: #475569;
            line-height: 1.5;
        }
        a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            text-decoration: underline;
        }
        .footer {
            margin-top: 50px;
            font-size: 0.9em;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Laraport</h1>
        <p>
            Laraport is an php fremwork for your develops
        </p>

        <div class="features">
            <div class="feature-item">
                <h3>Modern Develop</h3>
                <p>Modern developing web pages</p>
            </div>
            <div class="feature-item">
                <h3>Good Performance</h3>
                <p>Good speed and performance</p>
            </div>
            <div class="feature-item">
                <h3>Clean Code</h3>
                <p>Clean code and good structure</p>
            </div>
        </div>

        <div class="footer">
            <p>
                Thanks for your select Laraport fremwork
            </p>
            <p>
                <a href="#">Docs</a> | <a href="#">Contribute</a>
            </p>
        </div>
    </div>
</body>
</html>
